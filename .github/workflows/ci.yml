name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check lockfile resolves on MSRV
        run: cargo +1.85.0 check --workspace --locked
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.85.0 test --workspace --locked

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - name: Install plugin
        run: pip install -e 'python/pytest-testpilot[dev]'
      - run: ruff check python/pytest-testpilot
      - run: pytest python/pytest-testpilot -q
      - run: python scripts/sync_schema.py --check

  python-no-xdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - name: Install without xdist
        run: |
          pip install -e 'python/pytest-testpilot'
          pip install pytest-cov pytest-rerunfailures ruff
      - run: ruff check python/pytest-testpilot
      - name: Pytest without xdist installed
        run: |
          python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('xdist') is None else 1)" || pip uninstall -y pytest-xdist
          pytest python/pytest-testpilot -q -k 'not xdist'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - run: cargo +1.85.0 build -p testpilot-cli --locked
      - run: pip install -e 'python/pytest-testpilot[dev]'
      - run: bash tests/e2e/test_sample_project.sh
