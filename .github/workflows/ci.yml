name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check lockfile resolves on MSRV
        run: cargo +1.85.0 check --workspace --locked
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.85.0 test --workspace --locked

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - name: Install plugin
        run: pip install -e 'python/pytest-testpilot[dev]'
      - name: Offline wheelhouse for no-xdist venv test
        run: |
          mkdir -p /tmp/tp-wheels
          pip download -d /tmp/tp-wheels pytest coverage
      - run: ruff check python/pytest-testpilot
      - name: Pytest
        env:
          TESTPILOT_WHEELHOUSE: /tmp/tp-wheels
          TESTPILOT_REQUIRE_NO_XDIST: "1"
        run: pytest python/pytest-testpilot -q
      - run: python scripts/sync_schema.py --check

  python-no-xdist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - name: Install without xdist
        run: |
          pip install -e 'python/pytest-testpilot'
          pip install pytest-cov pytest-rerunfailures ruff
          python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('xdist') is None else 1)"
      - name: Offline wheelhouse for no-xdist venv test
        run: |
          mkdir -p /tmp/tp-wheels
          pip download -d /tmp/tp-wheels pytest coverage
      - run: ruff check python/pytest-testpilot
      - name: Pytest without xdist installed
        # Do not filter with -k; xdist tests use importorskip / dedicated venv.
        env:
          TESTPILOT_WHEELHOUSE: /tmp/tp-wheels
          TESTPILOT_REQUIRE_NO_XDIST: "1"
        run: pytest python/pytest-testpilot -q

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - name: Build wheel
        run: |
          pip install build
          python -m build python/pytest-testpilot
          ls python/pytest-testpilot/dist/*.whl
      - name: Install wheel in clean venv and smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile
          whls = glob.glob("python/pytest-testpilot/dist/*.whl")
          assert whls, "wheel missing"
          names = zipfile.ZipFile(whls[0]).namelist()
          assert any(n.endswith("pytest_testpilot/schema.sql") for n in names), names
          assert any(n.endswith("pytest_testpilot/__init__.py") for n in names), names
          print("wheel contents ok", whls[0])
          PY
          python -m venv /tmp/tp-wheel
          /tmp/tp-wheel/bin/pip install python/pytest-testpilot/dist/*.whl
          WORK=$(mktemp -d)
          cp -R tests/fixtures/sample_project/. "$WORK/"
          cd "$WORK"
          git init -b main
          git config user.email e2e@example.com
          git config user.name E2E
          git add .
          git commit -m init
          /tmp/tp-wheel/bin/pip install pytest coverage
          COVERAGE_CORE=ctrace /tmp/tp-wheel/bin/pytest --testpilot -q
          /tmp/tp-wheel/bin/python - <<'PY'
          import sqlite3
          c = sqlite3.connect(".testpilot/db.sqlite")
          runs = c.execute("SELECT COUNT(*) FROM test_runs").fetchone()[0]
          results = c.execute("SELECT COUNT(*) FROM test_results").fetchone()[0]
          assert runs >= 1, runs
          assert results >= 1, results
          print("db ok", {"runs": runs, "results": results})
          PY

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - run: cargo +1.85.0 build -p testpilot-cli --locked
      - run: pip install -e 'python/pytest-testpilot[dev]'
      - run: bash tests/e2e/test_sample_project.sh

  safe-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pytest-testpilot/pyproject.toml
      - run: cargo +1.85.0 build -p testpilot-cli --locked
      - run: pip install -e 'python/pytest-testpilot[dev]'
      - run: chmod +x tests/e2e/test_safe_e2e.sh && bash tests/e2e/test_safe_e2e.sh

  bootstrap-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python/pytest-testpilot/pyproject.toml
            python/testpilot-train/pyproject.toml
      - run: cargo +1.85.0 build -p testpilot-cli --locked
      - name: Install Python deps for bootstrap
        run: |
          pip install -e 'python/pytest-testpilot[dev]'
          pip install -e 'python/testpilot-train[dev]'
      - name: Bootstrap e2e (≤120s)
        run: chmod +x tests/e2e/test_bootstrap_e2e.sh && bash tests/e2e/test_bootstrap_e2e.sh

  features-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build CLI
        run: cargo +1.85.0 build -p testpilot-cli --locked
      - run: pip install pyarrow
      - run: bash tests/features_oracle.sh

  train-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/testpilot-train/pyproject.toml
      - name: Build CLI
        run: cargo +1.85.0 build -p testpilot-cli --locked
      - name: Install testpilot-train
        run: pip install -e 'python/testpilot-train[dev]'
      - name: Pytest train-oracle (<180s)
        run: |
          set -euo pipefail
          START=$(date +%s)
          pytest python/testpilot-train -q --durations=10
          PYTHONPATH=scripts pytest scripts/mutate -q --durations=20
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "train-oracle elapsed=${ELAPSED}s"
          if [ "$ELAPSED" -ge 180 ]; then
            echo "train-oracle exceeded 180s budget" >&2
            exit 1
          fi
