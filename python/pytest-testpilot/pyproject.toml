[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pytest-testpilot"
version = "0.1.0"
description = "pytest plugin that records outcomes and per-test coverage into TestPilot SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bocchisad" }]
dependencies = [
  "pytest>=7.0",
  "coverage>=7.4",
]

[project.optional-dependencies]
xdist = ["pytest-xdist>=3.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "pytest-rerunfailures>=14.0",
  "pytest-xdist>=3.0",
  "ruff>=0.6",
]

[project.entry-points.pytest11]
testpilot = "pytest_testpilot.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_testpilot"]

[tool.hatch.build.targets.sdist]
include = ["src/pytest_testpilot", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
