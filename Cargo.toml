[workspace]
resolver = "2"
members = [
    "crates/testpilot-core",
    "crates/testpilot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bocchisad/TestPilot"

[workspace.dependencies]
testpilot-core = { path = "crates/testpilot-core" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
# gix: default-features off. Note: `revision` + `blob-diff` still pull gix-protocol
# (and thus transport/url) transitively via attributes/index — that is expected for 0.70.
gix = { version = "0.70", default-features = false, features = [
    "revision",
    "blob-diff",
    "parallel",
] }
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
bytes = "1"
postcard = { version = "1", features = ["alloc"] }
zstd = "0.13"
ctrlc = "3"
